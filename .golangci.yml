# golangci-lint config — chuẩn chung cho common-go.
# Chạy: golangci-lint run ./...
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr

linters-settings:
  goimports:
    local-prefixes: github.com/aupv9/common-go
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
  max-issues-per-linter: 0
  max-same-issues: 0
